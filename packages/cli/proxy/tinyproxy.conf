# TokenForGood Sidecar Proxy Configuration
# Domain allowlist for sandbox network egress.
# NO github.com — GitHub access only through the credential broker.

Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 20

# Allow all connections from the isolated Docker network
Allow 0.0.0.0/0

# Enable domain filtering — deny by default, allow only listed domains
Filter "/etc/tinyproxy/filter.txt"
FilterURLs On
FilterDefaultDeny Yes
FilterCaseSensitive Off
FilterExtended On

# Logging (stdout for docker logs)
LogFile "/dev/stdout"
LogLevel Warning

# Connection limits
ConnectPort 443
ConnectPort 80
